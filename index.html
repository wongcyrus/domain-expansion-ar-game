<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domain Expansion AR</title>
    
    <!-- MediaPipe & Drawing Utilities -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Custom VFX Engine & Detection Logic -->
    <script src="static/js/domain_expansion.js"></script>
    <script src="static/js/hand_tracker.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .overlay {
            position: absolute;
            z-index: 50;
        }

        .header {
            top: 20px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .header h1 { margin: 0; font-size: 2rem; }
        .header p { margin: 0; font-size: 1rem; opacity: 0.8; }
        
        .logo-hkiit {
            top: 25px;
            left: 25px;
            pointer-events: none;
        }
        .logo-hkiit img { height: 160px; width: auto; }
        
        .top-right-stack {
            top: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 20px;
            pointer-events: none;
            z-index: 50;
        }
        .logo-it114115 img { height: 160px; width: auto; }
        
        #settings-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #4A90E2;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: auto;
        }
        
        .status-panel {
            bottom: 25px;
            left: 25px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 16px;
            pointer-events: none;
        }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot.active { background: #4CAF50; box-shadow: 0 0 10px #4CAF50; }
        
        .instructions {
            bottom: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            text-align: right;
            pointer-events: none;
        }

        .instructions div {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .settings-panel {
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            width: 300px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .settings-panel.hidden {
            transform: translateX(350px);
            opacity: 0;
            pointer-events: none;
        }
        .settings-header {
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-header h3 { margin: 0; font-size: 14px; color: #4A90E2; }
        .settings-header button { background: none; border: none; color: white; cursor: pointer; font-size: 18px; }
        
        .settings-content { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .settings-panel label { font-size: 11px; display: block; margin-bottom: 4px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.5px; }
        .settings-panel input, .settings-panel select { width: 100%; background: #222; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .settings-panel select option { background: #222; color: white; }
        .settings-panel button#save-settings { width: 100%; background: #4A90E2; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; transition: background 0.2s; }
        .settings-panel button#save-settings:active { background: #357ABD; }

        /* VFX Styles */
        #atmosphere-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: transparent;
            transition: background 0.5s ease;
        }

        /* Integrated Player Style */
        #integrated-player-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 480px;
            aspect-ratio: 16/9;
            z-index: 20; /* Above VFX */
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(74, 144, 226, 0.4);
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            transition: opacity 0.5s ease;
            pointer-events: none;
            display: flex;
        }
        #integrated-player-container.hidden { display: none; }
        #integrated-player { width: 100%; height: 100%; object-fit: contain; }

        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
            z-index: 40; /* Skeleton on top of EVERYTHING */
        }

        #vfx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
            z-index: 10; /* Between Camera and Video */
            opacity: 0.9;
        }

        /* Start Overlay - Massive Z-Index for clickability */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200; /* Absolute Top for interaction */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @media (max-width: 768px) {
            .header { top: 10px; width: 60%; padding: 8px 15px; z-index: 60; }
            .header h1 { font-size: 0.9rem; }
            .header p { font-size: 0.5rem; }
            #domain-display { font-size: 1.2rem !important; }

            .settings-panel { 
                width: 100%; 
                right: 0; 
                top: auto; 
                bottom: 0; 
                border-radius: 20px 20px 0 0;
                padding-bottom: 20px;
                background: rgba(0, 0, 0, 0.95);
                z-index: 150;
            }
            
            .logo-hkiit { top: 10px; left: 10px; }
            .logo-hkiit img { height: 70px; }
            
            .top-right-stack { top: 10px; right: 10px; gap: 8px; z-index: 90; }
            .logo-it114115 img { height: 70px; }
            
            #settings-toggle { width: 36px; height: 36px; font-size: 18px; }

            .instructions { display: none; }
            .status-panel { 
                bottom: 25px; 
                top: auto; 
                left: 15px; 
                padding: 8px; 
                font-size: 10px; 
                z-index: 30;
            }
        }

        /* Landscape Mobile Optimization */
        @media (max-width: 1024px) and (orientation: landscape) {
            .header { top: 5px; width: 45%; padding: 5px 10px; }
            .header h1 { font-size: 0.8rem; }
            .header p { display: none; }
            #domain-display { font-size: 1rem !important; margin-top: 5px; }

            .logo-hkiit { top: 5px; left: 10px; }
            .logo-hkiit img { height: 50px; }
            
            .top-right-stack { top: 5px; right: 10px; gap: 5px; z-index: 90; }
            .logo-it114115 img { height: 50px; }
            #settings-toggle { width: 30px; height: 30px; font-size: 12px; }

            .instructions { display: none !important; }
            .status-panel { bottom: 10px; left: 10px; padding: 5px; font-size: 9px; flex-direction: row; gap: 10px; }
            
            .settings-panel { width: 300px; height: 100vh; right: 0; top: 0; border-radius: 0; z-index: 150; }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div id="atmosphere-overlay"></div>
        <video id="webcam" playsinline webkit-playsinline></video>
        <canvas id="output-canvas"></canvas>
        <canvas id="vfx-canvas"></canvas>
        <div id="integrated-player-container" class="hidden">
            <video id="integrated-player" playsinline loop autoplay></video>
        </div>
    </div>

    <!-- Branding -->
    <div class="overlay logo-hkiit">
        <img src="static/img/hkiit_logo.png" alt="HKIIT Logo">
    </div>
    
    <div class="overlay top-right-stack">
        <div class="logo-it114115">
            <img src="static/img/it114115_logo.png" alt="IT114115 Logo">
        </div>
        <button id="settings-toggle">⚙️</button>
    </div>

    <div class="overlay header">
        <h1 id="main-title">🖐️ 領域展開 AR</h1>
        <p id="mode-display">結下手印以展開你的領域！</p>
        <div id="domain-display" style="font-size: 3.5rem; font-weight: bold; margin-top: 15px; color: #4A90E2; text-shadow: 0 0 30px rgba(74, 144, 226, 0.8);"></div>
    </div>

    <div class="overlay settings-panel hidden" id="settings-panel">
        <div class="settings-header">
            <h3 id="settings-title">⚙️ Settings</h3>
            <button id="close-settings">✕</button>
        </div>
        <div class="settings-content">
            <div>
                <label id="label-api-endpoint">🔗 Robot API Endpoint</label>
                <input type="text" id="api-endpoint" placeholder="e.g. https://your-site.awsapprunner.com">
            </div>
            <div>
                <label id="label-session-key">🔑 Session Key</label>
                <input type="text" id="session-key-input" placeholder="Enter your encrypted session key">
                <button id="save-settings" style="margin-top: 10px;">💾 Save Settings</button>
            </div>
            <div style="border-top: 1px solid #444; padding-top: 10px;">
                <label id="label-language">🌐 Language</label>
                <select id="language-select">
                    <option value="zh">🇭🇰 繁體中文</option>
                    <option value="auto">🌍 Auto Detect</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ja">🇯🇵 日本語</option>
                </select>
            </div>
            <div style="border-top: 1px solid #444; padding-top: 10px;">
                <label id="label-video-mode">🎬 Video Playback</label>
                <select id="video-playback-mode">
                    <option value="integrated">🖥️ Integrated (Sound)</option>
                    <option value="integrated_silent">🔇 Integrated (Silent)</option>
                    <option value="popup">🪟 Popup Tab</option>
                    <option value="none">🚫 No Video</option>
                </select>
                <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="auto-open-popup" style="width: auto;">
                    <span style="font-size: 11px; opacity: 0.8;">Auto-open Tab</span>
                    <button id="open-player-btn" style="font-size: 10px; padding: 2px 5px; background: #444; border: 1px solid #666; border-radius: 4px; color: white; cursor: pointer; margin-left: auto;">Open Player Tab</button>
                </div>
            </div>
            <div style="border-top: 1px solid #444; padding-top: 10px;">
                <label id="label-target-robot">🤖 Target Robot</label>
                <select id="robot-id">
                    <option value="all">🤖 All Robots</option>
                    <option value="robot_1">🤖 Robot 1</option>
                    <option value="robot_2">🤖 Robot 2</option>
                    <option value="robot_3">🤖 Robot 3</option>
                    <option value="robot_4">🤖 Robot 4</option>
                    <option value="robot_5">🤖 Robot 5</option>
                    <option value="robot_6">🤖 Robot 6</option>
                </select>
            </div>
            <div style="border-top: 1px solid #444; padding-top: 10px;">
                <label id="label-cooldown">🤖 Cooldown (s)</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="cooldown-slider" min="1" max="30" value="10" style="flex: 1;">
                    <span id="cooldown-val" style="font-size: 13px; width: 30px;">10s</span>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay status-panel">
        <div class="status-item">
            <div id="tracking-dot" class="dot"></div>
            <span>Tracking: <span id="tracking-status">Stopped</span></span>
        </div>
        <div id="api-status-item" class="status-item">
            <div id="api-dot" class="dot"></div>
            <span>API: <span id="api-status">Not Configured</span></span>
        </div>
        <div class="status-item" style="font-size: 8px; opacity: 0.6;">
            <span>Resp: <span id="last-resp">NONE</span></span>
        </div>
        <div style="font-size: 9px; opacity: 0.4; margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px; text-align: right;">
            Build: 2026.05.12.v53
        </div>
    </div>

    <div class="overlay instructions" id="instructions-panel">
        <!-- Will be populated by JS -->
    </div>

    <div id="start-overlay" style="pointer-events: auto;">
        <div style="text-align: center;">
            <div style="font-size: 80px; margin-bottom: 20px;">🖐️</div>
            <div style="font-size: 32px; color: #FFFF00; font-weight: bold; text-shadow: 0 0 20px rgba(255,255,0,0.5);">START AR GAME</div>
            <div style="font-size: 16px; color: #FFF; margin-top: 15px;">Click or Tap to initialize</div>
        </div>
    </div>
</body>
</html>
