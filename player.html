<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 AR Game Video Player</title>
    <link rel="stylesheet" href="static/css/player.css">
</head>
<body>
    <div id="placeholder" style="color: #666; transition: opacity 0.5s;">Waiting for Technique...</div>
    
    <div id="status-debug" style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; border-radius: 5px; z-index: 200; pointer-events: none; border: 1px solid #333;">
        <div>Connection: <span id="debug-conn">NO PARENT</span></div>
        <div>Interaction: <span id="debug-inter">LOCKED</span></div>
        <div>Last Event: <span id="debug-last">NONE</span></div>
    </div>

    <!-- Interaction Overlay for Autoplay -->
    <div id="interaction-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <div style="text-align: center;">
            <div style="font-size: 50px; margin-bottom: 10px;">📺</div>
            <div style="font-size: 18px; color: #4A90E2; font-weight: bold;">Click to Enable Audio/Video</div>
            <div style="font-size: 12px; color: #888; margin-top: 5px;">(Required for Dual Monitor Mode)</div>
        </div>
    </div>

    <video id="player" autoplay playsinline style="display:none"></video>

    <script src="static/js/player.js"></script>
</body>
</html>
