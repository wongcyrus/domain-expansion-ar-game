<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 AR Game Video Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #placeholder { color: #444; font-family: sans-serif; font-size: 20px; text-align: center; }
    </style>
</head>
<body>
    <div id="placeholder">Waiting for Technique...</div>
    <video id="player" autoplay playsinline style="display:none"></video>

    <script>
        const player = document.getElementById('player');
        const placeholder = document.getElementById('placeholder');

        window.addEventListener('message', (event) => {
            const { type, videoSrc } = event.data;
            if (type === 'PLAY_VIDEO' && videoSrc) {
                console.log('Playing:', videoSrc);
                placeholder.style.display = 'none';
                player.style.display = 'block';
                player.src = videoSrc;
                player.play().catch(e => console.warn('Autoplay prevented:', e));
            }
        });

        // Notify parent that we are ready
        if (window.opener) {
            window.opener.postMessage({ type: 'PLAYER_READY' }, '*');
        }
    </script>
</body>
</html>
