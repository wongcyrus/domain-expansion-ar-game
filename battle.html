<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Domain Expansion: BATTLE MODE</title>
    <script src="static/js/webrtc_broadcaster.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; display: flex; }
        .player-view { flex: 1; position: relative; height: 100%; border: 2px solid #222; overflow: hidden; background: #111; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .waiting-msg { position: absolute; z-index: 10; font-size: 1.5rem; color: #666; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        .hud { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; z-index: 20; pointer-events: none; }
        .domain-name { font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin-bottom: 10px; opacity: 0; transition: opacity 0.3s; }
        .domain-name.active { opacity: 1; }
        .score-box { background: rgba(0,0,0,0.7); padding: 10px 30px; border-radius: 40px; border: 2px solid #4A90E2; font-size: 2rem; font-weight: bold; }
        .vs-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; pointer-events: none; }
        .vs-logo { font-size: 6rem; font-style: italic; font-weight: 900; color: #FF5252; text-shadow: 0 0 30px rgba(255,82,82,0.8); letter-spacing: -5px; }
        .header-bar { position: absolute; top: 0; left: 0; right: 0; height: 280px; background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 70%, transparent 100%); z-index: 150; display: flex; align-items: center; justify-content: space-between; padding: 0 350px; box-sizing: border-box; }
        .logo-stack { display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; margin-top: 60px; }
        .branding-left { position: absolute; top: 25px; left: 25px; z-index: 160; pointer-events: none; }
        .branding-left img { height: 160px; width: auto; }
        .branding-right { position: absolute; top: 25px; right: 25px; z-index: 160; display: flex; flex-direction: column; align-items: flex-end; gap: 20px; }
        .branding-right img { height: 160px; width: auto; }
        #start-battle-btn { background: #FF5252; color: white; border: none; padding: 15px 30px; border-radius: 40px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,82,82,0.4); font-size: 1.1rem; transition: transform 0.2s, background 0.2s; pointer-events: auto; }
        #start-battle-btn:hover { transform: scale(1.05); background: #FF6E6E; }
        .player-label { font-size: 1.2rem; font-weight: bold; color: #4A90E2; text-transform: uppercase; letter-spacing: 3px; }
        #timer-display { font-size: 2rem; font-weight: bold; color: #FF5252; min-width: 100px; text-align: center; }
        .p1-color { color: #4A90E2; } .p2-color { color: #FFFF00; }
        .p1-border { border-color: #4A90E2; } .p2-border { border-color: #FFFF00; }
        #match-result-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.98); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); animation: fadeIn 0.5s ease-out; }
        #result-cinema { width: 80%; max-width: 900px; aspect-ratio: 16/9; background: #000; display: none; object-fit: contain; border: 4px solid #FFFF00; border-radius: 15px; box-shadow: 0 0 50px rgba(255,255,0,0.4); margin-bottom: 20px; }
        #winner-text { font-size: 7rem; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -2px; margin-bottom: 10px; text-shadow: 0 0 50px rgba(255,255,255,0.5); animation: winner-pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #winner-subtext { font-size: 2rem; color: #AAA; margin-bottom: 30px; letter-spacing: 8px; }
        .result-score-container { display: flex; gap: 100px; margin-bottom: 40px; }
        .result-score-item { display: flex; flex-direction: column; align-items: center; }
        .result-score-label { font-size: 1.2rem; margin-bottom: 5px; letter-spacing: 2px; }
        .result-score-val { font-size: 5rem; font-weight: bold; }
        @keyframes winner-pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #audio-status-hint { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; color: #FF5252; z-index: 2000; pointer-events: none; }
        #audio-status-hint.unlocked { color: #4CAF50; }
        #emergency-unmute { position: absolute; bottom: 40px; background: #FF5252; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; display: none; z-index: 1200; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="audio-status-hint">🔇 Audio Locked (Click anywhere)</div>
    <div class="branding-left"><img src="static/img/hkiit-logo.png" alt="HKIIT Logo"></div>
    <div class="branding-right">
        <img src="static/img/it114115-logo.png" alt="IT114115 Logo">
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-end;">
            <button id="start-battle-btn">START BATTLE</button>
            <div id="battle-settings-toggle" style="font-size: 0.8rem; cursor: pointer; color: #AAA; text-decoration: underline;">⚙️ Match Settings</div>
        </div>
    </div>

    <!-- Match Settings Panel -->
    <div id="battle-settings-panel" style="position: fixed; top: 180px; right: 25px; background: rgba(0,0,0,0.9); border: 1px solid #444; padding: 20px; border-radius: 12px; z-index: 200; display: none; flex-direction: column; gap: 15px; width: 250px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
        <h4 style="margin: 0; color: #4A90E2; font-size: 0.9rem;">MATCH CONFIG</h4>
        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="font-size: 11px; color: #888;">START COUNTDOWN (S)</label>
                <span id="val-countdown" style="font-size: 12px; font-weight: bold; color: #FFFF00;">3s</span>
            </div>
            <input type="range" id="cfg-countdown" value="3" min="0" max="10" style="width: 100%;">
        </div>
        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="font-size: 11px; color: #888;">TIME PER ACTION (S)</label>
                <span id="val-difficulty" style="font-size: 12px; font-weight: bold; color: #FFFF00;">8s</span>
            </div>
            <input type="range" id="cfg-difficulty" value="8" min="3" max="15" style="width: 100%;">
        </div>
        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="font-size: 11px; color: #888;">TECHNIQUES PER ROUND</label>
                <span id="val-count" style="font-size: 12px; font-weight: bold; color: #FFFF00;">11</span>
            </div>
            <input type="range" id="cfg-count" value="11" min="1" max="11" style="width: 100%;">
        </div>
        <button id="save-battle-cfg" style="background: #4A90E2; border: none; color: white; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px;">CLOSE</button>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdown-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 1500; display: none; align-items: center; justify-content: center; pointer-events: none;">
        <div id="countdown-text" style="font-size: 15rem; font-weight: 900; color: #FFFF00; text-shadow: 0 0 50px rgba(255,255,0,0.8); font-style: italic; animation: winner-pop 0.5s infinite alternate;">3</div>
    </div>

    <div class="header-bar">
        <div class="player-label p1-color">PLAYER 1 <span id="p1-timer-sub" style="font-size: 0.8em; opacity: 0.8; margin-left: 5px;"></span></div>
        <div class="logo-stack"><img src="static/img/jujutsu-kaisen-logo.png" alt="JJK Logo" style="height: 100px; width: auto; margin-bottom: 5px;"><div style="font-size: 2.5rem; font-weight: bold; color: white; letter-spacing: 4px; text-shadow: 0 0 15px rgba(74, 144, 226, 0.8);">領域展開 AR</div><div id="timer-display" style="font-size: 3rem; margin-top: 10px; color: #FF5252; font-weight: 900;">00:00</div></div>
        <div class="player-label p2-color"><span id="p2-timer-sub" style="font-size: 0.8em; opacity: 0.8; margin-right: 5px;"></span> PLAYER 2</div>
    </div>
    <div class="vs-overlay"><div class="vs-logo">VS</div></div>
    <div class="player-view p1-border" id="p1-view"><div class="waiting-msg" id="p1-waiting">WAITING FOR PLAYER 1...</div><video id="p1-video" autoplay playsinline muted></video><video id="p1-cinema" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; object-fit: contain; background: black; display: none;" playsinline></video><div class="hud"><div class="domain-name" id="p1-domain">DOMAIN</div><div class="score-box p1-border" id="p1-score">0</div></div></div>
    <div class="player-view p2-border" id="p2-view"><div class="waiting-msg" id="p2-waiting">WAITING FOR PLAYER 2...</div><video id="p2-video" autoplay playsinline muted></video><video id="p2-cinema" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; object-fit: contain; background: black; display: none;" playsinline></video><div class="hud"><div class="domain-name" id="p2-domain">DOMAIN</div><div class="score-box p2-border" id="p2-score">0</div></div></div>
    <div id="match-result-overlay"><video id="result-cinema" playsinline></video><button id="emergency-unmute">🔊 UNMUTE SOUND</button><div id="winner-subtext">VICTORY</div><div id="winner-text">PLAYER 1</div><div class="result-score-container"><div class="result-score-item p1-color"><div class="result-score-label">PLAYER 1</div><div id="res-score-p1" class="result-score-val">0</div></div><div class="result-score-item" style="color: #666; justify-content: center; font-size: 3rem; font-style: italic;">VS</div><div class="result-score-item p2-color"><div class="result-score-label">PLAYER 2</div><div id="res-score-p2" class="result-score-val">0</div></div></div><button id="close-result-btn" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 15px 60px; border-radius: 40px; font-size: 1.2rem; cursor: pointer; transition: background 0.3s;">BACK TO LOBBY</button></div>
    <script>
        const sync = new BattleModeSync('viewer');
        const p1Video = document.getElementById('p1-video'), p2Video = document.getElementById('p2-video'), p1Waiting = document.getElementById('p1-waiting'), p2Waiting = document.getElementById('p2-waiting');
        const p1Score = document.getElementById('p1-score'), p2Score = document.getElementById('p2-score'), p1Domain = document.getElementById('p1-domain'), p2Domain = document.getElementById('p2-domain');
        const timerDisplay = document.getElementById('timer-display'), p1TimerSub = document.getElementById('p1-timer-sub'), p2TimerSub = document.getElementById('p2-timer-sub'), startBtn = document.getElementById('start-battle-btn'), audioHint = document.getElementById('audio-status-hint');
        const p1Cinema = document.getElementById('p1-cinema'), p2Cinema = document.getElementById('p2-cinema'), resultCinema = document.getElementById('result-cinema'), emergencyUnmute = document.getElementById('emergency-unmute');
        const resultOverlay = document.getElementById('match-result-overlay'), winnerText = document.getElementById('winner-text'), winnerSubtext = document.getElementById('winner-subtext'), resScoreP1 = document.getElementById('res-score-p1'), resScoreP2 = document.getElementById('res-score-p2'), closeResultBtn = document.getElementById('close-result-btn');
        const winVideos = ['heroacademy.mp4', 'solo-leveling.mp4', 'onepunchman.mp4', '8-gate.mp4', 'escanor.mp4', 'onepunch.mp4', 'onepunch2.mp4'], loseVideos = Array.from({length: 9}, (_, i) => `shiba${i+1}.mp4`);
        
        // Match Config Elements
        const settingsToggle = document.getElementById('battle-settings-toggle'), settingsPanel = document.getElementById('battle-settings-panel'), saveCfgBtn = document.getElementById('save-battle-cfg');
        const inCountdown = document.getElementById('cfg-countdown'), inDifficulty = document.getElementById('cfg-difficulty'), inCount = document.getElementById('cfg-count');
        const countdownOverlay = document.getElementById('countdown-overlay'), countdownText = document.getElementById('countdown-text');

        settingsToggle.addEventListener('click', () => { settingsPanel.style.display = (settingsPanel.style.display === 'flex' ? 'none' : 'flex'); });
        saveCfgBtn.addEventListener('click', () => { settingsPanel.style.display = 'none'; });

        // Update Slider Values
        inCountdown.addEventListener('input', () => { document.getElementById('val-countdown').textContent = `${inCountdown.value}s`; });
        inDifficulty.addEventListener('input', () => { document.getElementById('val-difficulty').textContent = `${inDifficulty.value}s`; });
        inCount.addEventListener('input', () => { document.getElementById('val-count').textContent = inCount.value; });

        let p1Time = 0, p2Time = 0, p1Active = false, p2Active = false, p1ScoreVal = 0, p2ScoreVal = 0, isMatchOver = false, winnerTimeoutHandle = null;

        let isAudioUnlocked = false;
        async function masterAudioUnlock() {
            if (isAudioUnlocked) return;
            const unlockSrc = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '') + '/static/video/win/heroacademy.mp4';
            for (const v of [p1Cinema, p2Cinema, resultCinema]) {
                v.muted = false; v.volume = 1.0; v.src = unlockSrc; v.load();
                try { await v.play(); v.pause(); v.currentTime = 0; } catch(e) {}
            }
            isAudioUnlocked = true; audioHint.textContent = '🔊 Audio Active'; audioHint.classList.add('unlocked');
            setTimeout(() => audioHint.style.display = 'none', 3000);
        }
        document.addEventListener('click', masterAudioUnlock, { once: true });
        emergencyUnmute.addEventListener('click', (e) => { e.stopPropagation(); resultCinema.muted = false; resultCinema.volume = 1.0; resultCinema.play(); emergencyUnmute.style.display = 'none'; });

        function resetViewerState() {
            if (winnerTimeoutHandle) clearTimeout(winnerTimeoutHandle); winnerTimeoutHandle = null;
            isMatchOver = false; p1Active = false; p2Active = false; p1ScoreVal = 0; p2ScoreVal = 0;
            resultOverlay.style.display = 'none'; emergencyUnmute.style.display = 'none';
            resultCinema.pause(); resultCinema.style.display = 'none'; resultCinema.oncanplay = null;
            [p1Cinema, p2Cinema].forEach(c => { c.pause(); c.style.display = 'none'; });
            p1Score.textContent = '0'; p2Score.textContent = '0'; timerDisplay.textContent = '00:00';
            p1TimerSub.textContent = ''; p2TimerSub.textContent = '';
        }

        async function startMatch() {
            console.log('[Battle] START MATCH initiated');
            
            // 1. Force Dismiss Overlays on all screens first
            sync.broadcast('CLOSE_OVERLAYS', null);
            
            await masterAudioUnlock(); 
            resetViewerState();
            
            const countdownVal = parseInt(inCountdown.value) || 0;
            const difficulty = parseInt(inDifficulty.value) || 8;
            const count = parseInt(inCount.value) || 5;

            if (countdownVal > 0) {
                countdownOverlay.style.display = 'flex';
                for (let i = countdownVal; i > 0; i--) {
                    countdownText.textContent = i;
                    // Force a small tick animation
                    countdownText.style.animation = 'none';
                    void countdownText.offsetWidth;
                    countdownText.style.animation = 'winner-pop 0.5s';
                    await new Promise(r => setTimeout(r, 1000));
                }
                countdownText.textContent = "GO!";
                await new Promise(r => setTimeout(r, 500));
                countdownOverlay.style.display = 'none';
            }

            sync.broadcast('START_BATTLE', { difficulty, count });
            startBtn.style.background = '#4CAF50'; startBtn.textContent = 'GAME RUNNING';
            setTimeout(() => { startBtn.style.background = '#FF5252'; startBtn.textContent = 'START BATTLE'; }, 3000);
        }

        startBtn.addEventListener('click', startMatch);

        sync.onStreamReceived = (playerID, stream) => {
            if (playerID === 'player1') { p1Video.srcObject = stream; p1Waiting.style.display = 'none'; }
            else if (playerID === 'player2') { p2Video.srcObject = stream; p2Waiting.style.display = 'none'; }
        };

        sync.onPlayVideoSync = (playerID, videoSrc) => {
            if (isMatchOver) return;
            const cinema = (playerID === 'player1') ? p1Cinema : p2Cinema;
            cinema.src = videoSrc; cinema.style.display = 'block'; cinema.load();
            cinema.oncanplay = () => { cinema.muted = false; cinema.volume = 1.0; cinema.play().catch(() => { cinema.muted = true; cinema.play(); }); };
            cinema.onended = () => { cinema.style.display = 'none'; };
        };

        function playGlobalResultVideo(isWin) {
            const folder = isWin ? 'win' : 'lose';
            const video = (isWin ? winVideos : loseVideos)[Math.floor(Math.random() * (isWin ? winVideos : loseVideos).length)];
            const absSrc = `${window.location.origin}${window.location.pathname.replace(/\/[^\/]*$/, '')}/static/video/${folder}/${video}`;
            resultCinema.src = absSrc; resultCinema.style.display = 'block'; resultCinema.load();
            resultCinema.oncanplay = () => {
                resultCinema.muted = false; resultCinema.volume = 1.0;
                resultCinema.play().catch(() => { emergencyUnmute.style.display = 'block'; resultCinema.muted = true; resultCinema.play(); });
            };
            resultCinema.onended = () => { resultCinema.style.display = 'none'; resultCinema.src = ""; };
        }

        function showWinner() {
            if (isMatchOver) return; isMatchOver = true;
            [p1Cinema, p2Cinema].forEach(c => { c.pause(); c.style.display = 'none'; });
            resScoreP1.textContent = p1ScoreVal; resScoreP2.textContent = p2ScoreVal;
            const FULL_MARK = 10, PASS_MARK = 6;
            
            // Logic: Play win video for any clear winner
            let hasWinner = (p1ScoreVal !== p2ScoreVal) && (p1ScoreVal > 0 || p2ScoreVal > 0);
            let globalLose = (p1ScoreVal < PASS_MARK && p2ScoreVal < PASS_MARK);

            if (p1ScoreVal === p2ScoreVal) {
                winnerText.textContent = 'DRAW MATCH'; winnerSubtext.textContent = 'EQUAL POWER'; winnerText.style.color = '#FFF';
            } else if (p1ScoreVal > p2ScoreVal) {
                winnerText.textContent = 'PLAYER 1 WINS'; winnerText.style.color = '#4A90E2';
                winnerSubtext.textContent = (p1ScoreVal >= FULL_MARK) ? 'PERFECT VICTORY' : 'VICTORY';
            } else {
                winnerText.textContent = 'PLAYER 2 WINS'; winnerText.style.color = '#FFFF00';
                winnerSubtext.textContent = (p2ScoreVal >= FULL_MARK) ? 'PERFECT VICTORY' : 'VICTORY';
            }
            
            resultOverlay.style.display = 'flex';
            
            // Refined Cinematic Logic
            const isFullMarkWin = (p1ScoreVal >= FULL_MARK || p2ScoreVal >= FULL_MARK);
            const isDoubleFailure = (p1ScoreVal < PASS_MARK && p2ScoreVal < PASS_MARK);

            if (isFullMarkWin) {
                playGlobalResultVideo(true); // Perfect win cinematic
            } else if (isDoubleFailure) {
                playGlobalResultVideo(false); // Both failed cinematic
            }
            // Note: Normal victories (e.g. 8 vs 4) show the overlay but play no global video
        }

        sync.onStateReceived = (playerID, state) => {
            const { domain, score, timer, isGameActive } = state;
            if (playerID === 'player1') {
                const wasActive = p1Active; p1Active = isGameActive; p1ScoreVal = score; p1Score.textContent = score;
                if (domain) { p1Domain.textContent = domain; p1Domain.classList.add('active'); } else { p1Domain.classList.remove('active'); }
                if (isGameActive) { p1Time = timer; p1TimerSub.textContent = `(${timer}s)`; timerDisplay.textContent = timer + 's'; }
                else { p1TimerSub.textContent = ''; if (wasActive && !p2Active) { if (winnerTimeoutHandle) clearTimeout(winnerTimeoutHandle); winnerTimeoutHandle = setTimeout(showWinner, 1500); } }
            } else if (playerID === 'player2') {
                const wasActive = p2Active; p2Active = isGameActive; p2ScoreVal = score; p2Score.textContent = score;
                if (domain) { p2Domain.textContent = domain; p2Domain.classList.add('active'); } else { p2Domain.classList.remove('active'); }
                if (isGameActive) { p2Time = timer; p2TimerSub.textContent = `(${timer}s)`; if (!p1Active) timerDisplay.textContent = timer + 's'; }
                else { p2TimerSub.textContent = ''; if (wasActive && !p1Active) { if (winnerTimeoutHandle) clearTimeout(winnerTimeoutHandle); winnerTimeoutHandle = setTimeout(showWinner, 1500); } }
            }
        };
        closeResultBtn.addEventListener('click', () => { 
            resultOverlay.style.display = 'none'; 
            emergencyUnmute.style.display = 'none'; 
            isMatchOver = false; 
            sync.broadcast('CLOSE_OVERLAYS', null);
        });
    </script>
</body>
</html>
